[project]
name = "vox3"
version = "0.1.0"
description = "Prompt in, stylistic slop out. Fetches a corpus, trains a tiny char-level transformer, samples."
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.3",
  "anthropic>=0.40",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "pymupdf>=1.24",
  "ebooklib>=0.18",
  "yt-dlp>=2024.10.7",
]

[project.scripts]
vox3 = "vox3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vox3"]
